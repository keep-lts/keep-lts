name: Publish to npm

# Manual, deliberate publishing via npm trusted publishing (OIDC): no stored npm
# token. Each @keep-lts package on npmjs.com trusts this repo + this workflow file
# (publish.yml), so renaming this file breaks publishing until npm is updated.
# Trigger from the GitHub UI: Actions → "Publish to npm" → Run workflow.
# Leave "dry run" checked first to see exactly what would publish.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (run the test gate, but do not publish)"
        type: boolean
        default: true
      provenance:
        description: "Add signed provenance (ONLY works if this repo is PUBLIC — leave off while private)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # OIDC token: REQUIRED for npm trusted publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm may be older.
      - name: Upgrade npm
        run: npm install -g npm@11 && npm --version

      - name: Publish forks
        working-directory: publish
        env:
          KEEPLTS_PROVENANCE: ${{ inputs.provenance }}
        run: |
          chmod +x publish-all.sh
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            ./publish-all.sh --yes
          else
            ./publish-all.sh
          fi
