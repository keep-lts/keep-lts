name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # the upstream resolve tests are coupled to a present global git config
      - name: Ensure a global git config exists (deterministic test env)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - run: npm install
      - run: npm test
